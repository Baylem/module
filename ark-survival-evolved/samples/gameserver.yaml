apiVersion: gameplane.local/v1alpha1
kind: GameServer
metadata:
  name: ark-survival-evolved-01
  namespace: gameplane-games
spec:
  templateRef:
    name: ark-survival-evolved

  config:
    SESSION_NAME: "Gameplane ARK Server"
    SERVER_PASSWORD: ""
    MAX_PLAYERS: "70"
    SERVER_MAP: "TheIsland"
    CLUSTER_ID: "cluster-alpha"

  networking:
    expose: NodePort
    portOverrides:
      - name: game
        nodePort: 30777
      - name: raw
        nodePort: 30778
      - name: query
        nodePort: 32015

  storage:
    size: 35Gi

  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 6, memory: 16Gi }
