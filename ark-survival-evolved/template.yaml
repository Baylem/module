# yaml-language-server: $schema=../.schema/gametemplate.schema.json
# Gameplane GameTemplate for ARK: Survival Evolved (dedicated server).
#
# Runs the community image hermsi/ark-server
# (https://github.com/Hermsi1337/docker-ark-server), which installs and
# updates the server with SteamCMD and runs it under arkmanager.
# The volume is mounted at /app, the image's own data root: the game install
# lives in /app/server, with saves under /app/server/ShooterGame/Saved.
# Cluster transfer data lives in its own volume at /cluster.
#
# Cluster-scoped; apply once per cluster:
#     kubectl apply -f modules/ark-survival-evolved/template.yaml

apiVersion: gameplane.local/v1alpha1
kind: GameTemplate
metadata:
  name: ark-survival-evolved
  labels:
    gameplane.local/module: ark-survival-evolved
spec:
  displayName: "ARK: Survival Evolved"
  game: ark-survival-evolved
  version: 2.0.1
  categories: [Survival, Open World, Multiplayer, Dinosaurs]
  accentColor: "#00b2e2"
  description: |
    ARK: Survival Evolved dedicated server. Source RCON powers remote administration
    and server actions. The game install and world saves live under `/app/server`;
    cross-shard cluster transfers live in their own volume at `/cluster`.
    To upgrade, stop the server and back up its PVC. Move a 1.1 install into
    `/app/server`, or 1.0 saved data into `/app/server/ShooterGame/Saved`.
    Move cluster transfers to `/cluster`. Old data in either layout blocks startup.

  image: hermsi/ark-server:latest@sha256:ce291990613e76f7019be31b96fe247188ce4957724c913c0e30097042c44bf5

  versions:
    - id: latest
      displayName: "Latest"
      image: hermsi/ark-server:latest-1794213856@sha256:ce291990613e76f7019be31b96fe247188ce4957724c913c0e30097042c44bf5
      default: true

  # The vendor entrypoint can install a new world before an admin notices the
  # 1.x world on the same claim. Inspect both mounts before running vendor code.
  command: ["/bin/sh", "-ec"]
  args:
    - |
      refuse() {
        message="ARK storage check: $1. Stop the server and back up both PVCs. Move the 1.1 install to /app/server or 1.0 saves to /app/server/ShooterGame/Saved. Move old cluster transfers to /cluster. Verify copies before archiving leftovers. See the module README."
        printf '%s\n' "$message" >&2
        if [ -w /dev/termination-log ]; then printf '%s\n' "$message" > /dev/termination-log || :; fi
        exit 78
      }
      [ "$ARK_SERVER_VOLUME" = /app ] || refuse "the vendor data path must be /app"
      for mount in /app /cluster; do
        [ ! -L "$mount" ] && [ -d "$mount" ] && [ -r "$mount" ] && [ -x "$mount" ] &&
          /usr/bin/mountpoint -q "$mount" || refuse "missing or inaccessible PVC at $mount"
      done
      # GNU find returns nonzero on a traversal error or when its batched
      # command fails. Stop at the first match, even a dangling symlink.
      no_saved_root() {
        /usr/bin/find "$1" -mindepth 1 -maxdepth 1 \
          \( -name 'SavedArks*' -o -name SaveGames -o -name clusters -o -name Config -o -iname '*.ark*' \) \
          -exec /bin/false {} + -quit || refuse "1.0 save data or unreadable entries at $1"
      }
      no_saved_root /app
      /usr/bin/find /app -mindepth 1 -maxdepth 1 \( -name ShooterGame -o -name Engine -o -name steamapps \) \
        -exec /bin/false {} + -quit || refuse "1.1 install or unreadable entries at /app"
      old=/app/server/ShooterGame/Saved/clusters
      parent=/app
      for name in server ShooterGame Saved clusters; do
        /usr/bin/find "$parent" -mindepth 1 -maxdepth 1 -name "$name" \
          \( ! -type d -o ! -readable -o ! -executable \) -exec /bin/false {} + -quit ||
          refuse "cannot inspect $parent/$name"
        parent="$parent/$name"
        [ -d "$parent" ] || break
        if [ "$parent" = /app/server ]; then no_saved_root "$parent"; fi
      done
      if [ -d "$old" ]; then
        /usr/bin/find "$old" -mindepth 1 ! -type d -exec /bin/false {} + -quit ||
          refuse "unmigrated transfers or unreadable entries at $old"
      fi
      exec /docker-entrypoint.sh

  # The image starts as root: its entrypoint fixes volume ownership, loads
  # the crontab, then drops to the `steam` user (UID/GID 1000) with gosu.
  # Do NOT set runAsUser here, or the entrypoint cannot drop privileges.
  # fsGroup lets the dropped user write the PVCs.
  security:
    fsGroup: 1000

  env:
    # Without these the image's own defaults apply: a server password of
    # "YouShallNotPass" and no update on start. An empty SERVER_PASSWORD
    # here means an open server; the config field below overrides it.
    - name: SERVER_PASSWORD
      value: ""
    # Update the server through SteamCMD on every start, as 1.x did.
    - name: UPDATE_ON_START
      value: "true"
    # Gameplane runs its own backups; arkmanager's pre-update backup would
    # only fill the volume.
    - name: PRE_UPDATE_BACKUP
      value: "false"
    # Gameplane advertises the game port and the raw socket port separately.
    - name: GAME_CLIENT_PORT
      value: "7777"
    - name: UDP_SOCKET_PORT
      value: "7778"
    - name: SERVER_LIST_PORT
      value: "27015"
    - name: RCON_PORT
      value: "27020"

  ports:
    - name: game
      containerPort: 7777
      protocol: UDP
      advertise: true
    # Raw UDP socket, always game port + 1. ARK clients need it to join.
    - name: raw
      containerPort: 7778
      protocol: UDP
      advertise: true
    - name: query
      containerPort: 27015
      protocol: UDP
      advertise: true
    - name: rcon
      containerPort: 27020
      protocol: TCP
      advertise: false

  storage:
    size: 35Gi
    mountPath: /app
    extra:
      # The image keeps cluster transfer data (uploaded survivors, dinos
      # and items) in /cluster, outside /app.
      - name: cluster
        mountPath: /cluster
        size: 1Gi

  resources:
    requests: {cpu: "2", memory: 8Gi}
    limits: {cpu: "6", memory: 16Gi}

  rcon:
    protocol: source
    port: 27020
    passwordEnv: ADMIN_PASSWORD

  consoleMode: rcon

  probes:
    startup:
      tcpSocket:
        port: rcon
      initialDelaySeconds: 60
      periodSeconds: 15
      failureThreshold: 60
    readiness:
      tcpSocket:
        port: rcon
      periodSeconds: 10
      failureThreshold: 6
    liveness:
      tcpSocket:
        port: rcon
      periodSeconds: 30
      failureThreshold: 5

  capabilities:
    lifecycle:
      stop: ["SaveWorld", "DoExit"]
    actions:
      - id: broadcast
        displayName: Broadcast
        icon: megaphone
        group: Server
        command: 'ServerChat "{{.Params.message}}"'
        params:
          - name: message
            displayName: Message
            type: string
            required: true
      - id: save-world
        displayName: Save World
        icon: save
        group: World
        command: "SaveWorld"
      - id: kick-player
        displayName: Kick Player
        icon: user-x
        group: Moderation
        command: "KickPlayer {{.Params.user}}"
        params:
          - name: user
            displayName: Player SteamID
            type: string
            required: true

  configSchema:
    - name: SESSION_NAME
      displayName: Session Name
      type: string
      default: "Gameplane ARK Server"
    - name: SERVER_PASSWORD
      displayName: Server Password
      type: password
      default: ""
    - name: MAX_PLAYERS
      displayName: Max Players
      type: int
      default: 70
    - name: SERVER_MAP
      displayName: Map Name
      type: string
      default: "TheIsland"
    - name: CLUSTER_ID
      displayName: Cluster ID
      description: Shared cluster identifier for cross-ark transfers.
      type: string
      default: ""
