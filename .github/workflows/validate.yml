name: validate modules

# Preflight-checks every modules/<name>/template.yaml against the ACTUAL
# OCI image config of the image(s) it declares, catching the bug classes
# that have shipped broken before (see validate.py's module docstring for
# the full rule list and the historical bugs each one repros). Runs on
# every PR and on pushes to main so a template change is checked before it
# ever reaches a real cluster.
#
# Network access to Docker Hub is required (the validator resolves each
# declared image's manifest + config blob anonymously). A registry that
# can't be reached is reported as a WARN by the script itself, not a hard
# failure — so a real transient network blip degrades to "couldn't
# verify", not a red build. Only a confirmed problem (missing image,
# missing spec.command, missing security.runAsUser, a mount that shadows
# the image's own launcher, ...) fails the job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --disable-pip-version-check --user pyyaml

      - name: Check flush-only backup capabilities
        run: python3 test-backup-capabilities.py

      - name: Run module preflight validator
        run: python3 validate.py

      # build.sh's --sign path only ever executes in the release/republish
      # workflows, so a mistake in the manifest-digest parser would sign the
      # wrong object in production with nothing to catch it. These tests need
      # no registry and no cosign.
      - name: Test build.sh signing preconditions
        run: ./test-build-sh.sh

      - name: Test validate.py directory layout rules
        run: ./test-validate-py.sh

      - name: Check Palworld frame rate against an engine response
        run: python3 test-palworld-performance.py

      - name: Check Minecraft JVM settings in the pinned image
        run: python3 test-minecraft-jvm.py

      - name: Check ARK world migration in the pinned vendor image
        run: python3 test-ark-volume-migration.py

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check module locales
        run: |
          set -euo pipefail
          for dir in */; do
            dir="${dir%/}"
            [ -d "$dir/locales" ] || continue
            echo ">> i18n-check $dir"
            go run github.com/GameplanePanel/gameplane/i18n/cmd/i18n-check@master \
              --module "$dir/template.yaml" "$dir/locales"
          done

  devcontainer:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          configFile: .devcontainer/devcontainer.json
          runCmd: bash -n build.sh && python3 -m py_compile validate.py
